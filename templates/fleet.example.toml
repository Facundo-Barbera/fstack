# Copy to ~/.config/fstack/fleet.toml (or fstack.local.toml in a repo) and fill in.
# Never commit the filled copy: it describes your machines.

[machine]
# This machine's role: worker | orchestrator | heavy
role = "worker"

[roles.worker]
# Edits code in one worktree, verifies without servers (types, lint, unit tests).
may_run_dev_server = false
models = ["example-fast-model", "example-strong-model"]

[roles.orchestrator]
# Integrates branches, owns the single dev server per batch, runs E2E and screenshots.
may_run_dev_server = true
models = ["example-strong-model"]

[roles.heavy]
# Long builds, large test suites, local models.
may_run_dev_server = false
models = ["example-local-model"]

[dev_server]
# Fixed port per repo keeps the lock simple: one repo, one port, one server.
base_port = 3000
lock_dir = "~/.cache/fstack/locks"

[digest]
# Where batch digests are served privately (e.g. a tailnet-only URL). Leave empty to skip.
serve_url = ""
