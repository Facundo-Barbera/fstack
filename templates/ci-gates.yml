# Copy to .github/workflows/fstack-gates.yml in a repo that ran `fstack sync`.
# Runs the same gates as the local hooks, at the pinned version in .fstack/gates.
name: fstack gates
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: fstack gates
        env:
          FSTACK_BASE: origin/${{ github.base_ref }}
          # The gitleaks step above already covers secrets in CI.
          FSTACK_GATE_SECRETS: off
        run: .fstack/gates/run.sh ci
