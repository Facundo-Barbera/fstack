# Installed by fstack sync. Gate modes live in .fstack/config, not here.
pre-commit:
  jobs:
    - name: fstack-gates
      run: .fstack/gates/run.sh pre-commit

commit-msg:
  jobs:
    - name: fstack-stamp
      run: .fstack/gates/run.sh commit-msg {1}

pre-push:
  jobs:
    - name: fstack-gates
      run: .fstack/gates/run.sh pre-push

post-checkout:
  jobs:
    - name: fstack-adapters
      run: .fstack/gates/run.sh post-checkout
